version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/Zaplio", "/tests/Zaplio.Tests"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
